name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to RubyGems.org
    if: github.repository == 'nicolasva/solid-redis'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Publish gem
        uses: rubygems/release-gem@v1
